<!DOCTYPE html>
<html lang="it">
<head><meta name="google-site-verification" content="Ad6I8TEqa3aQxg12bHmrbCS3pWIvTghCf5oCMdpOBmE" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LevelUp - Discord</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      color: white;
      background: linear-gradient(135deg, #08000f, #250044, #08000f);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      max-width: 800px;
      padding: 40px 20px;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: auto;
      border-radius: 25px;
      background: #8b5cf6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      font-weight: bold;
      box-shadow: 0 0 40px #8b5cf6;
    }

    h1 {
      margin-top: 25px;
      font-size: 70px;
      color: #c084fc;
      text-shadow: 0 0 30px #8b5cf6;
    }

    p {
      margin: 25px auto;
      max-width: 600px;
      color: #ddd;
      font-size: 18px;
      line-height: 1.6;
    }

    .join {
      display: inline-block;
      margin-top: 15px;
      padding: 17px 35px;
      border-radius: 12px;
      background: #8b5cf6;
      color: white;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 0 25px #8b5cf6;
      transition: 0.2s;
    }

    .join:hover {
      transform: scale(1.06);
      box-shadow: 0 0 45px #a855f7;
    }

    .cards {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 50px;
      flex-wrap: wrap;
    }

    .card {
      width: 200px;
      padding: 20px;
      border-radius: 15px;
      background: #ffffff10;
      border: 1px solid #8b5cf655;
    }

    .card h3 {
      color: #c084fc;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 14px;
      margin: 0;
    }

    footer {
      margin-top: 45px;
      color: #806b99;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">L</div>

    <h1>LevelUp</h1>

    <p>
      🎮 Benvenuto su LevelUp!<br>
      Una community italiana dedicata al gaming,
      alle amicizie e al divertimento.
    </p>

    <a
      class="join"
      href="https://discord.gg/F9jehAACjB"
      target="_blank"
    >
      💜 ENTRA NEL DISCORD
    </a>

    <div class="cards">

      <div class="card">
        <h3>🎮 Gaming</h3>
        <p>Gioca e trova nuovi compagni.</p>
      </div>

      <div class="card">
        <h3>👥 Community</h3>
        <p>Conosci nuove persone.</p>
      </div>

      <div class="card">
        <h3>⚡ LevelUp</h3>
        <p>Porta il divertimento al livello successivo.</p>
      </div>

    </div>

    <footer>
      © 2026 LevelUp
    </footer>

  </div>

</body>
</html>
